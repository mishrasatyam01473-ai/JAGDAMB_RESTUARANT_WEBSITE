<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Brand Gradients: Citrus Orange, Mango Gold, Palm Green -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0f06" />
      <stop offset="100%" stop-color="#080402" />
    </linearGradient>

    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb800" />
      <stop offset="50%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="favCoconut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#0f5132" />
    </linearGradient>

    <linearGradient id="favJuice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd00" />
      <stop offset="50%" stop-color="#ff8800" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>

    <linearGradient id="favLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- Squircle Emblem Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#favBorder)" stroke-width="2.5" />

  <!-- Tropical Leaf -->
  <path d="M38 18 C38 10 49 11 51 15 C53 19 49 24 44 24 C41 24 38 21 38 18 Z" fill="url(#favLeaf)" />
  <path d="M39 19 Q45 16 50 15" stroke="#bbf7d0" stroke-width="0.8" stroke-linecap="round" />

  <!-- Straw (White with Orange Stripe) -->
  <path d="M34 27 L43 12 L48 14" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M38 20 L41 15" stroke="#ff5500" stroke-width="2.4" stroke-linecap="round" />

  <!-- Tender Coconut Base -->
  <path d="M15 33 C15 46 22 51 32 51 C42 51 49 46 49 33 C49 29 44 28 32 28 C20 28 15 29 15 33 Z" fill="url(#favCoconut)" />
  <path d="M18 39 C20 47 25 50 32 50 C39 50 44 47 46 39 C42 43 36 45 32 45 C28 45 22 43 18 39 Z" fill="#0b3820" opacity="0.6" />

  <!-- Golden Juice Splash -->
  <path d="M18 32 C21 29 25 32 28 30 C31 28 35 31 38 29 C41 28 46 32 46 32 C46 37 43 39 40 41 C37 43 34 40 32 43 C30 40 27 43 24 41 C21 39 18 37 18 32 Z" fill="url(#favJuice)" />

  <!-- Juice Drips -->
  <path d="M25 40 C24 44 25 46 26 46 C27 46 27 44 27 40 Z" fill="#ff7700" />
  <path d="M37 39 C36 43 37 45 38 45 C39 45 39 43 39 39 Z" fill="#ff7700" />

  <!-- Splash Droplets -->
  <circle cx="21" cy="25" r="1.8" fill="#ffb800" />
  <circle cx="46" cy="26" r="1.4" fill="#ffa000" />

  <!-- Glossy Reflection -->
  <path d="M18 35 C18 41 21 46 24 48" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
</svg>
